<!DOCTYPE html>
<html lang="PT-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incrição | Club Robótica</title>
</head>
<body>
    <header>
        <h1>Inscrição para a oficina de Robótica</h1>
    </header>

    <nav>
        <a href="../index.html">Início</a><br>
        <a href="oficina.html">Página inicial da oficina de Robótica</a>
    </nav>

    <main>
        <h2>Tabela</h2>
         <table>
            <caption>Horário das oficinas de robótica</caption>
            <thead>
               <tr>
                  <th scope="col">Oficina</th>
                  <th scope="col">Dia</th>
                  <th scope="col">Hora</th>
               </tr>
            </thead>
            <tbody>
               <tr>
                  <th scope="row">Projeção dos robôs</th>
                  <td>Terça-feira</td>
                  <td>14:30 H</td>
               </tr>
               <tr>
                  <th scope="row">Criação dos robôs</th>
                  <td>Quarta-feira</td>
                  <td>15:00 H</td>
               </tr>
               <tr>
                  <th scope="row">Programação dos robôs</th>
                  <td>Sexta-feira</td>
                  <td>16:30 H</td>
               </tr>
            </tbody>
         </table>
         <section>
            <h2>Inscrição na oficina de Robótica</h2>
            <label for="name">Nome</label>
            <input type="text" id="nome" nome="nome" required><br>

            <label for="email">Email</label>
            <input type="text" id="email" email="email" required><br>
            <label for="oficina">Oficina</label>

            <textarea id="mensagem" name="mensagem" rows="3"></textarea><br>
            <button type="submit">Submissão</button>
         </section>
    </main>

    <footer>
    </footer>
    
</body>
</html>
